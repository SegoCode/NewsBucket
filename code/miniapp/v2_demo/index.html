<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f3f5">
<title>NewsBucket · Wire (demo)</title>
<style>
:root {
    --fb-bg: #f2f3f5;
    --fb-card: #ffffff;
    --fb-text: #111318;
    --fb-hint: #6b7079;
    --fb-sub: #e7e9ed;
    --fb-line: #e1e3e8;
    --bg: var(--tg-theme-bg-color, var(--fb-bg));
    --card: var(--tg-theme-section-bg-color, var(--fb-card));
    --text: var(--tg-theme-text-color, var(--fb-text));
    --hint: var(--tg-theme-hint-color, var(--fb-hint));
    --sub: var(--tg-theme-secondary-bg-color, var(--fb-sub));
    --line: var(--fb-line);
    --btn: var(--tg-theme-button-color, var(--text));
    --btn-text: var(--tg-theme-button-text-color, var(--bg));
    --hot: #d92d20;
    --warm: #b26b00;
    --ok: #1e8a3c;
    --l4: #9b3fd0;
    --l5: #000;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --r: 16px;
    --tap: 44px;
    color-scheme: light;
}

:root[data-theme="dark"] {
    --fb-bg: #0e0e10;
    --fb-card: #1c1c1f;
    --fb-text: #f2f2f4;
    --fb-hint: #8e8e96;
    --fb-sub: #2a2a2e;
    --fb-line: #2e2e33;
    --hot: #ff5a4f;
    --warm: #f5b335;
    --ok: #3ccf63;
    --l4: #c77dff;
    --l5: #fff;
    color-scheme: dark;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    background: var(--bg);
}

body {
    max-width: 520px;
    min-height: 100dvh;
    margin: 0 auto;
    padding: 0 14px 28px;
    font: 16px/1.45 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
}

body:has(#chrome:not([hidden])) {
    padding-bottom: calc(100px + env(safe-area-inset-bottom));
}

body.is-live {
    overflow: hidden;
}

button,
select {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    cursor: pointer;
}

/* ── header ─────────────────────────────────────── */

#top {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 18px 0 10px;
}

#top hgroup {
    flex: 1;
    min-width: 0;
}

#day {
    font-size: 1.3em;
    font-weight: 750;
    line-height: 1.15;
    letter-spacing: -.02em;
}

#stamp {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 6px;
    font: 500 .68rem/1 var(--mono);
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--hint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

#stamp::before {
    content: "";
    flex: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent);
}

.icon-btn {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-width: var(--tap);
    height: var(--tap);
    padding: 0 14px;
    border-radius: 999px;
    background: var(--card);
    box-shadow: inset 0 0 0 1px var(--line);
    font-size: .88em;
    font-weight: 650;
}

#theme {
    padding: 0;
}

.icon-btn svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}

:root[data-theme="dark"] .i-moon,
:root:not([data-theme="dark"]) .i-sun {
    display: none;
}

#topics {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    gap: 8px;
    margin: 0 -14px 8px;
    padding: 8px 14px;
    overflow-x: auto;
    scrollbar-width: none;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    -webkit-backdrop-filter: saturate(1.4) blur(14px);
    backdrop-filter: saturate(1.4) blur(14px);
}

#topics::-webkit-scrollbar {
    display: none;
}

#topics button {
    flex: none;
    min-height: var(--tap);
    padding: 0 18px;
    border-radius: 999px;
    background: var(--card);
    box-shadow: inset 0 0 0 1px var(--line);
    color: var(--hint);
    font-size: .95em;
    font-weight: 600;
    transition: background .2s, color .2s;
}

#topics button[aria-selected="true"] {
    background: var(--text);
    box-shadow: none;
    color: var(--bg);
}

/* ── language sheet ─────────────────────────────── */

#langSheet {
    width: 100%;
    max-width: 520px;
    margin: auto auto 0;
    padding: 0;
    border: 0;
    border-radius: 22px 22px 0 0;
    background: var(--card);
    color: var(--text);
    box-shadow: 0 -10px 40px rgb(0 0 0 / .18);
}

#langSheet[open] {
    animation: sheet-up .28s cubic-bezier(.2, .8, .2, 1);
}

#langSheet::backdrop {
    background: rgb(0 0 0 / .35);
}

#langSheet form {
    padding: 8px 14px calc(16px + env(safe-area-inset-bottom));
}

.grabber {
    width: 36px;
    height: 5px;
    margin: 0 auto 14px;
    border-radius: 3px;
    background: var(--line);
}

#langSheet h3 {
    padding: 0 4px 10px;
    font: 600 .68rem/1 var(--mono);
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--hint);
}

#langSheet button {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 56px;
    padding: 0 16px;
    border-radius: 14px;
    font-size: 1.05em;
    font-weight: 600;
}

#langSheet button + button {
    margin-top: 4px;
}

#langSheet button[aria-current="true"] {
    background: var(--sub);
}

#langSheet button[aria-current="true"]::after {
    content: "";
    width: 7px;
    height: 13px;
    margin: 0 4px 4px auto;
    border: solid var(--text);
    border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg);
}

#langSheet small {
    margin-left: 10px;
    font: .72rem var(--mono);
    color: var(--hint);
}

/* ── feed ───────────────────────────────────────── */

#feed {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

#feed > * {
    animation: rise .4s cubic-bezier(.2, .7, .2, 1) both;
    animation-delay: calc(min(var(--i, 0), 12) * 30ms);
}

.story,
.alert,
.board,
.panel {
    position: relative;
    padding: 14px 16px;
    border-radius: var(--r);
    background: var(--card);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--line) 70%, transparent);
}

.story,
[data-url] {
    cursor: pointer;
}

.story {
    transition: transform .12s;
}

.story:active,
.alert:active,
.board:active {
    transform: scale(.985);
}

.story.high {
    --heat: var(--hot);
}

.story.medium {
    --heat: var(--warm);
}

.story.old {
    opacity: .7;
}

@media (hover: hover) {
    .story:hover,
    .alert:hover,
    .board:hover {
        box-shadow: 0 0 0 1px var(--line), 0 6px 18px rgb(0 0 0 / .07);
    }
}

h2 {
    font-size: 1.03em;
    font-weight: 620;
    line-height: 1.3;
    letter-spacing: -.005em;
    text-wrap: pretty;
}

.story.high h2 {
    font-size: 1.1em;
}

.byline {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 7px;
    font: .7rem/1.3 var(--mono);
    color: var(--hint);
}

.heat {
    flex: none;
    padding: 3px 8px;
    border-radius: 999px;
    font: 650 .7rem/1.2 system-ui, -apple-system, sans-serif;
    color: var(--heat, var(--hint));
    background: color-mix(in srgb, var(--heat, var(--hint)) 13%, transparent);
}

.src {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.story.open .src {
    white-space: normal;
}

.chev {
    flex: none;
    width: 7px;
    height: 7px;
    margin: 0 2px 3px;
    border: solid var(--hint);
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
    transition: transform .25s;
}

.story.open .chev {
    transform: rotate(225deg) translate(-2px, -2px);
}

.summary {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .28s ease;
}

.summary > div {
    min-height: 0;
    overflow: hidden;
}

.summary p {
    padding-top: 8px;
    font-size: .9em;
    color: color-mix(in srgb, var(--text) 72%, var(--hint));
}

.story.open .summary {
    grid-template-rows: 1fr;
}

/* tags shared by alerts, boards and panels */

.tag {
    display: flex;
    align-items: center;
    gap: 7px;
    font: 600 .64rem/1 var(--mono);
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--tone, var(--hint));
}

.tag .dot {
    flex: none;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
}

.tag .when {
    margin-left: auto;
    font-weight: 500;
    letter-spacing: .03em;
    text-transform: none;
    color: var(--hint);
}

.alert {
    --tone: var(--hot);
    background: color-mix(in srgb, var(--tone) 8%, var(--card));
    box-shadow: none;
    border: 1.5px dashed color-mix(in srgb, var(--tone) 75%, transparent);
}

.alert.l4 {
    --tone: var(--l4);
}

.alert.l5 {
    --tone: var(--l5);
    border-style: solid;
}

.alert h2 {
    margin-top: 7px;
    font-size: 1em;
    font-weight: 650;
}

.ext {
    margin-left: 6px;
    font-weight: 400;
    font-size: .85em;
    color: var(--hint);
}

#feed > .alert.recent {
    animation:
        rise .4s cubic-bezier(.2, .7, .2, 1) calc(min(var(--i, 0), 12) * 30ms) both,
        breathe 1.6s ease-in-out infinite;
}

.recent .tag .dot,
.steps li.running .st,
#MainButton.ring::before,
.badge i {
    animation: ping 1.4s ease-out infinite;
}

/* markets board (FX + spikes) */

.board {
    box-shadow: none;
    border: 1.5px dashed color-mix(in srgb, var(--hint) 50%, transparent);
}

.board .tag {
    color: var(--text);
}

.quote {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
}

.tag + .quote {
    margin-top: 6px;
}

.quote > div {
    flex: 1;
    min-width: 0;
}

.quote small {
    display: block;
    font: .62rem/1.3 var(--mono);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--hint);
}

.quote strong {
    display: block;
    font-weight: 620;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.sym {
    font: .74rem var(--mono);
    color: var(--hint);
}

.delta {
    min-width: 5.2em;
    padding: 5px 7px;
    border-radius: 7px;
    font: 600 .78rem/1 var(--mono);
    font-variant-numeric: tabular-nums;
    text-align: right;
}

.delta.up {
    color: var(--ok);
    background: color-mix(in srgb, var(--ok) 14%, transparent);
}

.delta.down {
    color: var(--hot);
    background: color-mix(in srgb, var(--hot) 12%, transparent);
}

/* status topic */

.steps {
    list-style: none;
    margin-top: 8px;
}

.steps li {
    position: relative;
    display: flex;
    gap: 12px;
    padding: 7px 0;
}

.steps li:not(:last-child)::before {
    content: "";
    position: absolute;
    left: 6px;
    top: 26px;
    bottom: -9px;
    width: 2px;
    background: var(--line);
}

.st {
    flex: none;
    width: 14px;
    height: 14px;
    margin-top: 3px;
    border-radius: 50%;
    color: var(--c);
    background: currentColor;
}

.steps li.ok { --c: var(--ok); }
.steps li.running { --c: var(--warm); }
.steps li.fail { --c: var(--hot); }

.steps h3 {
    font-size: .95em;
    font-weight: 600;
}

.steps small {
    font: .7rem/1.4 var(--mono);
    color: var(--hint);
}

.steps em {
    font-style: normal;
    color: var(--c);
}

.panel .ghost {
    display: block;
    width: 100%;
    margin-top: 10px;
    min-height: var(--tap);
    padding: 0 12px;
    border-radius: 10px;
    background: var(--sub);
    font-size: .82em;
    font-weight: 600;
    letter-spacing: .05em;
    appearance: none;
    -webkit-appearance: none;
}

.panel dl {
    display: grid;
    grid-template-columns: 7.5em 1fr;
    gap: 8px 12px;
    margin-top: 12px;
    font-size: .85em;
}

.panel dt {
    font: .7rem/1.7 var(--mono);
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--hint);
}

.panel dd.ok { color: var(--ok); }
.panel dd.medium { color: var(--warm); }

/* divider + skeleton */

.divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 14px 0 4px;
    font: 600 .64rem/1 var(--mono);
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--hint);
}

.divider::before,
.divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
}

#feed > .skel {
    height: 68px;
    border-radius: var(--r);
    background: linear-gradient(100deg, var(--sub) 40%, color-mix(in srgb, var(--sub) 45%, var(--card)) 50%, var(--sub) 60%);
    background-size: 300% 100%;
    animation: shimmer 1.2s linear infinite;
}

/* ── bottom dock (Telegram MainButton / SecondaryButton / BackButton) ── */

#chrome {
    position: fixed;
    inset: auto 0 0;
    z-index: 10000;
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
    pointer-events: none;
}

#chrome[hidden] {
    display: none;
}

.dock {
    display: flex;
    gap: 6px;
    max-width: 492px;
    margin: 0 auto;
    padding: 6px;
    border-radius: 18px;
    background: color-mix(in srgb, var(--card) 82%, transparent);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    backdrop-filter: blur(18px) saturate(1.4);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--line) 80%, transparent), 0 10px 30px rgb(0 0 0 / .14);
    pointer-events: auto;
}

.dock button {
    flex: 1 1 auto;
    min-width: 0;
    padding: 12px 10px;
    border-radius: 13px;
    background: var(--sub);
    font-size: .82em;
    font-weight: 700;
    letter-spacing: .07em;
    white-space: nowrap;
}

.dock button[hidden] {
    display: none;
}

#MainButton {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    background: var(--btn);
    color: var(--btn-text);
}

#MainButton.ring::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    color: var(--hot);
    background: currentColor;
}

.is-live .dock {
    background: rgb(24 24 26 / .72);
    color: #f2f2f2;
    box-shadow: 0 0 0 1px rgb(255 255 255 / .08);
}

.is-live .dock button {
    background: rgb(255 255 255 / .12);
}

.is-live #MainButton {
    background: #fff;
    color: #000;
}

/* ── live overlay ───────────────────────────────── */

#live {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: 2px;
    padding-bottom: calc(78px + env(safe-area-inset-bottom));
    background: #000;
}

#live[hidden] {
    display: none;
}

.live-player {
    position: relative;
    overflow: hidden;
}

.screen {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(120% 90% at 25% 20%, hsl(var(--h) 60% 38%), transparent 60%),
        radial-gradient(100% 80% at 85% 90%, hsl(calc(var(--h) + 40) 55% 24%), transparent 65%),
        hsl(var(--h) 30% 8%);
    background-size: 150% 150%;
    animation: drift 9s ease-in-out infinite alternate;
}

.screen::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgb(255 255 255 / .035) 0 1px, transparent 1px 3px);
}

.badge {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border-radius: 6px;
    background: var(--hot);
    color: #fff;
    font: 700 .64rem/1 var(--mono);
    letter-spacing: .12em;
}

.badge i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    color: #fff;
    background: currentColor;
}

.name,
.clock {
    position: absolute;
    bottom: 12px;
    z-index: 1;
    color: #fff;
    text-shadow: 0 1px 8px rgb(0 0 0 / .6);
}

.name {
    left: 12px;
    font-weight: 650;
}

.clock {
    right: 12px;
    font: .72rem var(--mono);
    opacity: .8;
}

/* ── motion ─────────────────────────────────────── */

@keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
}

@keyframes sheet-up {
    from { transform: translateY(100%); }
}

@keyframes breathe {
    50% { border-color: transparent; }
}

@keyframes ping {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 55%, transparent); }
    100% { box-shadow: 0 0 0 7px transparent; }
}

@keyframes shimmer {
    from { background-position: 100% 0; }
    to { background-position: 0 0; }
}

@keyframes drift {
    to { background-position: 100% 100%; }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>
<body>
    <header id="top">
        <hgroup>
            <h1 id="day"></h1>
            <p id="stamp"></p>
        </hgroup>
        <button type="button" id="langBtn" class="icon-btn" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9s1.3-6.4 3.8-9z"/></svg>
            <span id="langCode"></span>
        </button>
        <button type="button" id="theme" class="icon-btn" aria-label="Claro / oscuro (solo demo)" title="Claro / oscuro (solo demo)">
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
    </header>
    <nav id="topics" role="tablist" aria-label="Topic"></nav>
    <main id="feed" aria-live="polite"></main>
    <dialog id="langSheet">
        <form method="dialog">
            <div class="grabber"></div>
            <h3 id="langTitle"></h3>
            <button value="en">English<small>EN</small></button>
            <button value="es">Español<small>ES</small></button>
            <button value="jp">日本語<small>JP</small></button>
        </form>
    </dialog>
    <div id="live" hidden>
        <section class="live-player" aria-label="Live News"><div class="screen"></div></section>
        <section class="live-player" aria-label="Second Live News"><div class="screen"></div></section>
    </div>
    <footer id="chrome" hidden>
        <div class="dock">
            <button type="button" id="BackButton" hidden></button>
            <button type="button" id="SecondaryButton" hidden></button>
            <button type="button" id="MainButton"></button>
        </div>
    </footer>
    <script src="data.js"></script>
    <script>
const DATA = window.DATA;
const $ = id => document.getElementById(id);
const root = document.documentElement;
const feed = $('feed');
const topicsEl = $('topics');
const sheet = $('langSheet');
const stampEl = $('stamp');
const chromeBar = $('chrome');
const live = $('live');
const main = $('MainButton');
const second = $('SecondaryButton');
const back = $('BackButton');
const screens = [...live.querySelectorAll('.screen')];

const TOPICS = ['status', 'finance', 'gaming', 'japan', 'tech'];
const LOCALE = { en: 'en-US', es: 'es-ES', jp: 'ja-JP' };
const L = {
    en: {
        topics: ['Status', 'Finance', 'Gaming', 'Japan', 'Tech'],
        yesterday: 'Yesterday', stories: 'stories', updated: 'updated', language: 'Language', sources: n => `${n} sources`,
        live: 'LIVE NEWS', cams: 'LIVE CAMERAS', back: 'BACK', next: 'NEXT', toEn: 'ENGLISH', toJp: 'JAPANESE', onAir: 'LIVE',
        quake: 'Quake', weather: 'Weather alert', outage: 'Outage', markets: 'Markets', pipeline: 'Pipeline', diag: 'Diagnostics',
        ago: m => m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`,
        ask: 'REQUEST LOCATION', running: 'running', failed: 'failed at',
        dl: ['Permission', 'Location', 'Address', 'GitHub', 'Cloudflare', 'JMA'],
        dd: ['granted', 'Shibuya, Tokyo', '203.0.113.42', 'operational', 'operational', 'rate limited · 429'],
    },
    es: {
        topics: ['Estado', 'Finanzas', 'Gaming', 'Japón', 'Tech'],
        yesterday: 'Ayer', stories: 'historias', updated: 'actualizado', language: 'Idioma', sources: n => `${n} fuentes`,
        live: 'EN DIRECTO', cams: 'CÁMARAS', back: 'VOLVER', next: 'SIGUIENTE', toEn: 'INGLÉS', toJp: 'JAPONÉS', onAir: 'EN VIVO',
        quake: 'Sismo', weather: 'Alerta meteo', outage: 'Caída', markets: 'Mercados', pipeline: 'Pipeline', diag: 'Diagnóstico',
        ago: m => m < 60 ? `hace ${m} min` : `hace ${Math.round(m / 60)} h`,
        ask: 'SOLICITAR UBICACIÓN', running: 'en curso', failed: 'falló en',
        dl: ['Permiso', 'Ubicación', 'Dirección', 'GitHub', 'Cloudflare', 'JMA'],
        dd: ['concedido', 'Shibuya, Tokio', '203.0.113.42', 'operativo', 'operativo', 'limitado · 429'],
    },
    jp: {
        topics: ['状態', '金融', 'ゲーム', '日本', 'テック'],
        yesterday: '昨日', stories: '件', updated: '更新', language: '言語', sources: n => `${n}ソース`,
        live: 'ライブニュース', cams: 'ライブカメラ', back: '戻る', next: '次へ', toEn: 'ENGLISH', toJp: '日本語', onAir: 'LIVE',
        quake: '地震', weather: '気象警報', outage: '障害', markets: 'マーケット', pipeline: 'パイプライン', diag: '診断',
        ago: m => m < 60 ? `${m}分前` : `${Math.round(m / 60)}時間前`,
        ask: '位置情報をリクエスト', running: '実行中', failed: '失敗',
        dl: ['許可', '現在地', 'アドレス', 'GitHub', 'Cloudflare', 'JMA'],
        dd: ['許可済み', '東京都渋谷区', '203.0.113.42', '正常', '正常', '制限中 · 429'],
    },
};

const special = (topic, lang) => {
    const p = o => o[lang] || o.en;
    if (topic === 'japan') return [
        {
            kind: 'quake', recent: true, mins: 4, url: 'https://www.jma.go.jp/bosai/map.html#contents=earthquake_map',
            title: p({ en: 'M5.4 | Off the coast of Ibaraki', es: 'M5.4 | Frente a la costa de Ibaraki', jp: 'M5.4 | 茨城県沖' }),
            src: ['JMA', p({ en: 'Max intensity 4', es: 'Intensidad máx. 4', jp: '最大震度4' })],
        },
        {
            kind: 'weather', level: 4, recent: true, mins: 35, url: 'https://www.jma.go.jp/bosai/warning/',
            title: p({ en: 'Heavy rain warning', es: 'Aviso por lluvias intensas', jp: '大雨警報' }),
            src: ['JMA', p({ en: 'Kagoshima', es: 'Kagoshima', jp: '鹿児島県' })],
        },
        {
            kind: 'quake', mins: 130, url: 'https://www.jma.go.jp/bosai/map.html#contents=earthquake_map',
            title: p({ en: 'M3.8 | Satsuma, Kagoshima', es: 'M3.8 | Satsuma, Kagoshima', jp: 'M3.8 | 鹿児島県薩摩地方' }),
            src: ['JMA', p({ en: 'Max intensity 2', es: 'Intensidad máx. 2', jp: '最大震度2' })],
        },
    ];
    if (topic === 'tech') return [
        {
            kind: 'outage', recent: true, mins: 6, url: 'https://www.cloudflarestatus.com/',
            title: p({ en: 'Cloudflare: elevated API errors in Tokyo (NRT)', es: 'Cloudflare: errores elevados de API en Tokio (NRT)', jp: 'Cloudflare: 東京 (NRT) でAPIエラー増加' }),
            src: ['cloudflarestatus.com'],
        },
        {
            kind: 'outage', mins: 72, url: 'https://health.aws.amazon.com/health/status',
            title: p({ en: 'AWS: EC2 degraded in ap-northeast-1', es: 'AWS: EC2 degradado en ap-northeast-1', jp: 'AWS: ap-northeast-1 で EC2 性能低下' }),
            src: ['health.aws.amazon.com'],
        },
    ];
    if (topic === 'finance') return [
        {
            board: true, mins: 12, url: 'https://finance.yahoo.com/', src: ['bankofcanada.ca', 'finance.yahoo.com'],
            rows: [
                lang === 'es'
                    ? { label: 'FX', name: '1 EUR = ¥168,42', delta: 0.31 }
                    : { label: 'FX', name: '1 USD = ¥149.85', delta: -0.12 },
                { label: p({ en: 'Top gainer', es: 'Mayor subida', jp: '値上がり率トップ' }), name: 'Advantest', sym: '6857.T', delta: 7.82 },
                { label: p({ en: 'Top loser', es: 'Mayor caída', jp: '値下がり率トップ' }), name: 'Rakuten Group', sym: '4755.T', delta: -4.1 },
            ],
        },
    ];
    return [];
};

const PIPE = [
    ['Tech digest', 'ok', '08:41', '2m 13s'],
    ['Finance digest', 'ok', '08:42', '1m 07s'],
    ['Gaming digest', 'ok', '08:44', '2m 41s'],
    ['Japan digest', 'running', '08:47', '1m 02s'],
    ['Translated editions', 'fail', '08:31', '48s', 'Translate clusters'],
];
const DIAG_CLS = ['ok', '', '', 'ok', 'ok', 'medium'];

const CHANNELS = {
    jp: [['NHK 総合', 205], ['TBS NEWS DIG', 350]],
    en: [['NHK WORLD-JAPAN', 190], ['ANN News · English', 20]],
};
const CAMS = [
    ['Shibuya Scramble Crossing', 260], ['Tokyo Tower', 15], ['Shinjuku Kabukicho', 300],
    ['Osaka Dotonbori', 40], ['Sapporo Odori Park', 200], ['Fukuoka Nakasu', 330],
];

let topic = 'japan';
let lang = 'es';
let loadTimer = 0;
let liveOn = false;
let mode = 'news';
let liveEn = false;
let cam = 0;
let clockTimer = 0;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const heat = c => c >= 4 ? 'high' : c >= 3 ? 'medium' : 'low';
const TIER = { high: 1, medium: 2, low: 3 };
const pct = d => new Intl.NumberFormat(LOCALE[lang], { signDisplay: 'always', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(d) + '%';
const jst = (d, seconds) => new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', ...(seconds && { second: '2-digit' }) }).format(d);
const jstDay = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Tokyo', month: '2-digit', day: '2-digit' }).format(new Date());
const updatedAt = () => jst(new Date(Date.now() - 23 * 60e3));

const storyHtml = (it, i, old) => `
    <article class="story ${heat(it.c)}${old ? ' old' : ''}" style="--i:${i}" tabindex="0">
        <h2>${esc(it.t)}</h2>
        <div class="byline">
            <span class="heat">${L[lang].sources(it.c)}</span>
            <span class="src">${it.src.map(esc).join(' · ')}</span>
            ${it.s ? '<span class="chev" aria-hidden="true"></span>' : ''}
        </div>
        ${it.s ? `<div class="summary"><div><p>${esc(it.s)}</p></div></div>` : ''}
    </article>`;

const alertHtml = (a, i) => {
    const l = L[lang];
    const cls = ['alert', a.recent && 'recent', a.level >= 5 ? 'l5' : a.level >= 4 ? 'l4' : ''].filter(Boolean).join(' ');
    return `
    <article class="${cls}" style="--i:${i}" data-url="${a.url}" tabindex="0">
        <div class="tag"><span class="dot"></span>${esc(l[a.kind])}${a.level ? ` · L${a.level}` : ''}<span class="when">${l.ago(a.mins)}</span></div>
        <h2>${esc(a.title)}<span class="ext" aria-hidden="true">↗</span></h2>
        <div class="byline"><span class="src">${a.src.map(esc).join(' · ')}</span></div>
    </article>`;
};

const boardHtml = (b, i) => `
    <article class="board" style="--i:${i}" data-url="${b.url}" tabindex="0">
        <div class="tag"><span class="dot"></span>${L[lang].markets}<span class="when">${L[lang].ago(b.mins)}</span></div>
        ${b.rows.map(r => `
        <div class="quote">
            <div><small>${esc(r.label)}</small><strong>${esc(r.name)}</strong></div>
            ${r.sym ? `<span class="sym">${esc(r.sym)}</span>` : ''}
            <span class="delta ${r.delta >= 0 ? 'up' : 'down'}">${pct(r.delta)}</span>
        </div>`).join('')}
        <div class="byline"><span class="src">${b.src.join(' · ')}</span></div>
    </article>`;

const statusHtml = () => {
    const l = L[lang];
    return `
    <section class="panel" style="--i:0">
        <div class="tag"><span class="dot"></span>${l.pipeline} · update-news.yml<span class="when">${l.ago(23)}</span></div>
        <ol class="steps">${PIPE.map(([name, st, at, dur, step]) => `
            <li class="${st}" data-url="https://github.com/SegoCode/NewsBucket/actions">
                <span class="st"></span>
                <div>
                    <h3>${name}</h3>
                    <small>${jstDay} ${at} · ${dur}${st === 'running' ? ` · <em>${l.running}</em>` : ''}${step ? ` · <em>${l.failed} ${esc(step)}</em>` : ''}</small>
                </div>
            </li>`).join('')}
        </ol>
    </section>
    <section class="panel" style="--i:1">
        <div class="tag">${l.diag}</div>
        <button type="button" class="ghost">${l.ask}</button>
        <select class="ghost" aria-label="Prefecture">
            <option>東京都 · Tokyo</option><option>大阪府 · Osaka</option><option>北海道 · Hokkaido</option><option>鹿児島県 · Kagoshima</option>
        </select>
        <dl>${l.dl.map((k, i) => `<dt>${k}</dt><dd class="${DIAG_CLS[i]}">${l.dd[i]}</dd>`).join('')}</dl>
    </section>`;
};

const paint = () => {
    const l = L[lang];
    if (topic === 'status') {
        feed.innerHTML = statusHtml();
        stampEl.textContent = `${l.updated} ${updatedAt()} JST`;
        return;
    }
    const { today, yesterday } = DATA[topic][lang];
    let i = 0;
    let html = special(topic, lang).map(x => x.board ? boardHtml(x, i++) : alertHtml(x, i++)).join('');
    html += [...today].sort((a, b) => TIER[heat(a.c)] - TIER[heat(b.c)]).map(x => storyHtml(x, i++)).join('');
    if (yesterday.length) {
        html += `<p class="divider" style="--i:${i++}">${l.yesterday}</p>`;
        html += yesterday.map(x => storyHtml(x, i++, true)).join('');
    }
    feed.innerHTML = html;
    stampEl.textContent = `${today.length} ${l.stories} · ${updatedAt()} JST`;
};

const load = () => {
    clearTimeout(loadTimer);
    feed.innerHTML = Array.from({ length: 5 }, (_, i) => `<div class="skel" style="--i:${i}"></div>`).join('');
    loadTimer = setTimeout(paint, 420);
};

const paintControls = () => {
    const l = L[lang];
    topicsEl.innerHTML = TOPICS.map((t, i) =>
        `<button type="button" role="tab" data-topic="${t}" aria-selected="${t === topic}">${l.topics[i]}</button>`).join('');
    const day = new Intl.DateTimeFormat(LOCALE[lang], { timeZone: 'Asia/Tokyo', weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
    $('day').textContent = day[0].toUpperCase() + day.slice(1);
    $('langCode').textContent = lang.toUpperCase();
    $('langBtn').setAttribute('aria-label', l.language);
    $('langTitle').textContent = l.language;
    sheet.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', b.value === lang));
    root.lang = { en: 'en', es: 'es', jp: 'ja' }[lang];
};

const tick = () => {
    const t = `${jst(new Date(), true)} JST`;
    live.querySelectorAll('.clock').forEach(c => { c.textContent = t; });
};

const paintLive = () => {
    const pair = mode === 'cams'
        ? [CAMS[cam % CAMS.length], CAMS[(cam + 1) % CAMS.length]]
        : CHANNELS[liveEn ? 'en' : 'jp'];
    screens.forEach((s, i) => {
        const [name, hue] = pair[i];
        s.style.setProperty('--h', hue);
        s.innerHTML = `<span class="badge"><i></i>${L[lang].onAir}</span><span class="name">${esc(name)}</span><span class="clock"></span>`;
    });
    tick();
};

const paintChrome = () => {
    const l = L[lang];
    chromeBar.hidden = !liveOn && topic !== 'japan';
    live.hidden = !liveOn;
    document.body.classList.toggle('is-live', liveOn);
    back.hidden = second.hidden = !liveOn;
    back.textContent = l.back;
    second.textContent = mode === 'cams' ? l.live : l.cams;
    main.textContent = liveOn ? (mode === 'cams' ? l.next : liveEn ? l.toJp : l.toEn) : l.live;
    main.classList.toggle('ring', !liveOn);
};

const setLive = on => {
    liveOn = on;
    clearInterval(clockTimer);
    if (on) {
        mode = 'news';
        liveEn = false;
        paintLive();
        clockTimer = setInterval(tick, 1000);
    }
    paintChrome();
};

const setTheme = t => {
    root.dataset.theme = t;
    document.querySelector('meta[name="theme-color"]').content = getComputedStyle(root).getPropertyValue('--bg').trim();
};
const centerTopic = () => topicsEl.querySelector('[aria-selected="true"]').scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });

topicsEl.onclick = e => {
    const b = e.target.closest('[data-topic]');
    if (!b || b.dataset.topic === topic) return;
    topic = b.dataset.topic;
    paintControls();
    paintChrome();
    centerTopic();
    load();
};

$('langBtn').onclick = () => {
    sheet.returnValue = '';
    sheet.showModal();
};

sheet.onclick = e => {
    if (e.target === sheet) sheet.close();
};

sheet.onclose = () => {
    const next = sheet.returnValue;
    if (!next || next === lang) return;
    lang = next;
    paintControls();
    paintChrome();
    load();
};

feed.onclick = e => {
    const link = e.target.closest('[data-url]');
    if (link) {
        window.open(link.dataset.url, '_blank', 'noopener');
        return;
    }
    e.target.closest('.story')?.classList.toggle('open');
};

feed.onkeydown = e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const el = e.target.closest('.story, [data-url]');
    if (!el) return;
    e.preventDefault();
    el.click();
};

main.onclick = () => {
    if (!liveOn) return setLive(true);
    if (mode === 'cams') cam += 2;
    else liveEn = !liveEn;
    paintLive();
    paintChrome();
};

second.onclick = () => {
    mode = mode === 'cams' ? 'news' : 'cams';
    paintLive();
    paintChrome();
};

back.onclick = () => setLive(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && liveOn) setLive(false); });
$('theme').onclick = () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');

setTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
paintControls();
centerTopic();
paintChrome();
load();
    </script>
</body>
</html>
