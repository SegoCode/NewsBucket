name: Update news

on:
  workflow_dispatch:
  schedule:
    # 9:00 AM JST (00:00 UTC) every day
    - cron: '0 0 * * *'

concurrency:
  group: update-news-main
  cancel-in-progress: false

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install
        working-directory: ./code

      - name: Fetch RSS feeds
        run: pnpm run feeds
        working-directory: ./code

      - name: Validate RSS output
        run: pnpm run validate-feeds
        working-directory: ./code

      - name: Commit RSS output
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add code/rss_output/
          if ! git diff --staged --quiet; then
            git commit -m "Update RSS feeds $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  generate-news:
    needs: fetch-rss
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout RSS commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.fetch-rss.outputs.commit_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install
        working-directory: ./code

      - name: Cluster with AI
        run: pnpm run cluster
        working-directory: ./code
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      - name: Translate clusters
        run: pnpm run translate
        working-directory: ./code
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      - name: Validate cluster translations
        run: pnpm run validate-clusters
        working-directory: ./code

      - name: Commit cluster output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add code/rss_output_cluster/
          if ! git diff --staged --quiet; then
            git commit -m "Update news clusters $(date -u +'%Y-%m-%d %H:%M UTC')"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
