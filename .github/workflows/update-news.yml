name: Update news

on:
  workflow_dispatch:
  schedule:
    # Once every 24 hours at 00:00 UTC
    - cron: '0 0 * * *'

concurrency:
  group: update-news-main
  cancel-in-progress: false

jobs:
  fetch-rss:
    name: Fetch RSS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: &write-permissions
      contents: write
    env:
      OUTPUT_PATH: code/rss_output/
      COMMIT_MESSAGE: Update RSS feeds

    steps:
      - &checkout
        name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - &setup-pnpm
        name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - &setup-node
        name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml

      - &install
        name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./code

      - name: Fetch RSS feeds
        timeout-minutes: 12
        run: pnpm run feeds
        working-directory: ./code

      - &commit
        name: Commit
        timeout-minutes: 3
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -- "$OUTPUT_PATH"
          if ! git diff --staged --quiet; then
            git commit -m "$COMMIT_MESSAGE $(date -u +'%Y-%m-%d %H:%M UTC')"
            for attempt in 1 2 3; do
              git pull --rebase origin main || exit 1
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep "$((attempt * 2))"
            done
          else
            echo "No changes to commit"
          fi

  cluster-tech:
    name: Cluster tech
    needs: fetch-rss
    if: ${{ !cancelled() && needs.fetch-rss.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: *write-permissions
    env:
      CATEGORY: tech
      OUTPUT_PATH: code/rss_output_cluster/rss_tech_clusters_es.json
      COMMIT_MESSAGE: Update tech clusters

    steps:
      - *checkout
      - *setup-pnpm
      - *setup-node
      - *install

      - &cluster
        name: Generate clusters
        run: pnpm run cluster -- "$CATEGORY"
        working-directory: ./code
        env: &llm-env
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - *commit

  cluster-finance:
    name: Cluster finance
    needs: [fetch-rss, cluster-tech]
    if: ${{ !cancelled() && needs.fetch-rss.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: *write-permissions
    env:
      CATEGORY: finance
      OUTPUT_PATH: code/rss_output_cluster/rss_finance_clusters_es.json
      COMMIT_MESSAGE: Update finance clusters

    steps:
      - *checkout
      - *setup-pnpm
      - *setup-node
      - *install
      - *cluster
      - *commit

  cluster-gaming:
    name: Cluster gaming
    needs: [fetch-rss, cluster-finance]
    if: ${{ !cancelled() && needs.fetch-rss.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: *write-permissions
    env:
      CATEGORY: gaming
      OUTPUT_PATH: code/rss_output_cluster/rss_gaming_clusters_es.json
      COMMIT_MESSAGE: Update gaming clusters

    steps:
      - *checkout
      - *setup-pnpm
      - *setup-node
      - *install
      - *cluster
      - *commit

  cluster-japan:
    name: Cluster japan
    needs: [fetch-rss, cluster-gaming]
    if: ${{ !cancelled() && needs.fetch-rss.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: *write-permissions
    env:
      CATEGORY: japan
      OUTPUT_PATH: code/rss_output_cluster/rss_japan_clusters_es.json
      COMMIT_MESSAGE: Update japan clusters

    steps:
      - *checkout
      - *setup-pnpm
      - *setup-node
      - *install
      - *cluster
      - *commit

  translate:
    name: Translate clusters
    needs: [fetch-rss, cluster-tech, cluster-finance, cluster-gaming, cluster-japan]
    if: ${{ !cancelled() && needs.fetch-rss.result == 'success' && (needs.cluster-tech.result == 'success' || needs.cluster-finance.result == 'success' || needs.cluster-gaming.result == 'success' || needs.cluster-japan.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: *write-permissions
    env:
      OUTPUT_PATH: code/rss_output_cluster/
      COMMIT_MESSAGE: Update cluster translations
      CATEGORIES: >-
        ${{ needs.cluster-tech.result == 'success' && 'tech' || '' }}
        ${{ needs.cluster-finance.result == 'success' && 'finance' || '' }}
        ${{ needs.cluster-gaming.result == 'success' && 'gaming' || '' }}
        ${{ needs.cluster-japan.result == 'success' && 'japan' || '' }}

    steps:
      - *checkout
      - *setup-pnpm
      - *setup-node
      - *install

      - name: Translate all categories
        id: translate
        continue-on-error: true
        run: |
          status=0
          for category in $CATEGORIES; do
            for language in en jp; do
              pnpm run translate -- "$category" "$language" || status=1
            done
          done
          exit "$status"
        working-directory: ./code
        env: *llm-env
      - *commit

      - name: Report translation failures
        if: ${{ !cancelled() && steps.translate.outcome == 'failure' }}
        run: |
          echo "Translation failed; successful files were committed"
          exit 1
